[package]
name = "pastel-media-pro"
version = "0.0.0"
description = "Pastel Media Pro desktop app"
authors = ["San Milano"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
default-run = "pastel-media-pro"

# The web version's dev server reads the test library through this (see apps/player/test-media.ts).
[[bin]]
name = "library-export"
path = "src/bin/library-export.rs"
required-features = ["test-media"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# Dev builds only: scan the repo's media_to_test folder (or PASTEL_TEST_MEDIA) and show it on the media pages.
test-media = []

[dependencies]
tauri = { version = "2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
regex = "1"
walkdir = "2"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
