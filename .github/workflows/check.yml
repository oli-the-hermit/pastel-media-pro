# Runs the checks on every push and pull request: npm run check (types, ESLint, Stylelint, the
# tests and a production build), then the Rust tests.
#
# The design system is linked with file: from its own repository beside this one, and that
# repository is private for now. CI checks both out side by side, the design system with a
# read-only token in the DESIGN_SYSTEM_TOKEN secret (see the README). Once it is public the
# token can go.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    env:
      HAS_DESIGN_SYSTEM_TOKEN: ${{ secrets.DESIGN_SYSTEM_TOKEN != '' }}
    steps:
      - name: The design system can be checked out
        if: env.HAS_DESIGN_SYSTEM_TOKEN != 'true'
        shell: bash
        run: |
          echo "::error::The DESIGN_SYSTEM_TOKEN secret is missing: CI cannot check out the private design system (see the README)."
          exit 1

      # Side by side, as on a developer's machine: the app links ../pastel-studio-theme.
      - uses: actions/checkout@v7
        with:
          path: pastel-media-pro

      - uses: actions/checkout@v7
        with:
          repository: oli-the-hermit/pastel-studio-ds
          token: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          path: pastel-studio-theme

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pastel-media-pro/package-lock.json
            pastel-studio-theme/package-lock.json

      # The link brings none of the design system's own dependencies (React types, the font).
      - name: Install the design system
        working-directory: pastel-studio-theme
        run: npm ci

      - name: Install
        working-directory: pastel-media-pro
        run: npm ci

      - name: npm run check
        working-directory: pastel-media-pro
        run: npm run check

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pastel-media-pro/apps/player/src-tauri

      # Tauri embeds the built UI (apps/player/dist, made by npm run check above).
      - name: Rust tests
        working-directory: pastel-media-pro/apps/player/src-tauri
        run: cargo test
